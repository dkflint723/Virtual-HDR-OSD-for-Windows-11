[project]
name = "virtual-hdr-osd-for-windows"
version = "1.0.9"
description = "HDR pseudo-calibration OSD and MHC2 profile editor for Windows 11"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6==6.7.2",
    "PySide6-Fluent-Widgets==1.11.3",
]

[project.scripts]
virtual-hdr-osd = "sdr_hdr_profile_creator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdr_hdr_profile_creator"]

[tool.uv]
package = true
